<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Project Hafnia visual AI data platform</title><desc id="desc">Video flows from edge sources through Kinesis Video Streams to S3, annotation, a governed data lake and SageMaker model training. AWS Organizations, Control Tower, identity, encryption and monitoring provide the platform foundation.</desc><defs><style>.t{font:600 14px Arial;fill:#102334}.s{font:12px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="560" fill="#f8f8f5"/><text x="55" y="52" class="h">REGULATION-COMPLIANT VISUAL AI DATA PIPELINE</text><rect x="55" y="98" width="130" height="78" rx="8" fill="#fff" stroke="#a6b6bc"/><text x="120" y="130" text-anchor="middle" class="t">Video sources</text><text x="120" y="153" text-anchor="middle" class="s">edge · on-premises</text><image href="../diagram/aws/kinesis-video.svg" x="245" y="98" width="78" height="78"/><image href="../diagram/aws/s3.svg" x="430" y="98" width="78" height="78"/><rect x="600" y="98" width="140" height="78" rx="8" fill="#e6f0f2" stroke="#146c7e" stroke-width="2"/><text x="670" y="130" text-anchor="middle" class="t">Annotation</text><text x="670" y="153" text-anchor="middle" class="s">review workflow</text><image href="../diagram/aws/s3.svg" x="825" y="98" width="78" height="78"/><image href="../diagram/aws/sagemaker.svg" x="1020" y="98" width="78" height="78"/><path d="M185 137H235M333 137H420M518 137H590M750 137H815M913 137H1010" class="l" marker-end="url(#a)"/><text x="284" y="210" text-anchor="middle" class="t">Kinesis Video</text><text x="469" y="210" text-anchor="middle" class="t">S3 landing zone</text><text x="864" y="210" text-anchor="middle" class="t">Governed data</text><text x="1059" y="210" text-anchor="middle" class="t">SageMaker</text><text x="55" y="315" class="h">CROSS-CUTTING CLOUD FOUNDATION</text><rect x="55" y="345" width="1090" height="145" rx="8" fill="#fff" stroke="#a6b6bc"/><image href="../diagram/aws/organizations.svg" x="155" y="375" width="68" height="68"/><text x="189" y="468" text-anchor="middle" class="t">Organizations</text><image href="../diagram/aws/control-tower.svg" x="410" y="375" width="68" height="68"/><text x="444" y="468" text-anchor="middle" class="t">Control Tower</text><image href="../diagram/aws/iam.svg" x="665" y="375" width="68" height="68"/><text x="699" y="468" text-anchor="middle" class="t">IAM + KMS</text><image href="../diagram/aws/cloudwatch.svg" x="920" y="375" width="68" height="68"/><text x="954" y="468" text-anchor="middle" class="t">CloudWatch</text></svg>
