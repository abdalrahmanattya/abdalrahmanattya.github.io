<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Agillic AWS cloud modernisation architecture</title><desc id="desc">Legacy workloads migrated to AWS and were redesigned around serverless orchestration, managed analytics, storage and content delivery. Governance and monitoring support the environment, contributing to an 85 percent operational cost reduction.</desc><defs><style>.t{font:600 14px Arial;fill:#102334}.s{font:12px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="540" fill="#f8f8f5"/><text x="55" y="52" class="h">MIGRATION AND ARCHITECTURE REDESIGN</text><rect x="55" y="95" width="180" height="85" rx="8" fill="#fff" stroke="#a6b6bc"/><text x="145" y="130" text-anchor="middle" class="t">Legacy workloads</text><text x="145" y="154" text-anchor="middle" class="s">on-premises systems</text><image href="../diagram/aws/transfer.svg" x="315" y="100" width="76" height="76"/><path d="M235 137H305M401 137H470" class="l" marker-end="url(#a)"/><rect x="480" y="78" width="665" height="220" rx="10" fill="#fff" stroke="#a6b6bc"/><image href="../diagram/aws/lambda.svg" x="535" y="110" width="64" height="64"/><image href="../diagram/aws/step-functions.svg" x="690" y="110" width="64" height="64"/><image href="../diagram/aws/emr.svg" x="845" y="110" width="64" height="64"/><image href="../diagram/aws/s3.svg" x="535" y="205" width="64" height="64"/><image href="../diagram/aws/apigw.svg" x="690" y="205" width="64" height="64"/><image href="../diagram/aws/cloudfront.svg" x="845" y="205" width="64" height="64"/><text x="1010" y="145" class="t">Managed compute</text><text x="1010" y="170" class="s">orchestration · analytics</text><text x="1010" y="240" class="t">Managed delivery</text><text x="1010" y="265" class="s">storage · APIs · content</text><text x="55" y="355" class="h">GOVERNANCE AND OPERATIONS</text><rect x="55" y="385" width="1090" height="105" rx="8" fill="#fff" stroke="#a6b6bc"/><image href="../diagram/aws/organizations.svg" x="150" y="405" width="62" height="62"/><text x="225" y="443" class="t">Organizations</text><image href="../diagram/aws/control-tower.svg" x="440" y="405" width="62" height="62"/><text x="515" y="443" class="t">Control Tower</text><image href="../diagram/aws/cloudwatch.svg" x="735" y="405" width="62" height="62"/><text x="810" y="443" class="t">CloudWatch</text><text x="990" y="435" text-anchor="middle" style="font:400 30px Georgia;fill:#146c7e">85% lower cost</text><text x="990" y="462" text-anchor="middle" class="s">with improved performance</text></svg>
