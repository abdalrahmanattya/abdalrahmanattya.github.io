<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">AWS Customer Support Assistant architecture</title><desc id="desc">Customer and staff browser paths enter through CloudFront and API Gateway. Lambda and SQS process grounded Bedrock responses, while DynamoDB stores sessions and tickets and Cognito authenticates staff.</desc><defs><style>.t{font:600 15px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.g{fill:#fff;stroke:#a6b6bc;stroke-width:1.5}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="560" fill="#f8f8f5"/><text x="55" y="52" class="h">QUESTION TO GROUNDED ANSWER</text><rect x="55" y="88" width="145" height="88" rx="8" class="g"/><text x="127" y="124" text-anchor="middle" class="t">Customer + staff</text><text x="127" y="148" text-anchor="middle" class="s">browser</text><image href="../diagram/aws/cloudfront.svg" x="255" y="92" width="78" height="78"/><image href="../diagram/aws/apigw.svg" x="410" y="92" width="78" height="78"/><image href="../diagram/aws/lambda.svg" x="565" y="92" width="78" height="78"/><image href="../diagram/aws/sqs.svg" x="720" y="92" width="78" height="78"/><rect x="865" y="88" width="270" height="88" rx="8" fill="#e6f0f2" stroke="#146c7e" stroke-width="2"/><image href="../diagram/aws/bedrock.svg" x="888" y="96" width="70" height="70"/><text x="1030" y="124" text-anchor="middle" class="t">Amazon Bedrock</text><text x="1030" y="148" text-anchor="middle" class="s">knowledge · guardrails</text><path d="M200 132H245M343 132H400M498 132H555M653 132H710M808 132H855" class="l" marker-end="url(#a)"/><text x="294" y="203" text-anchor="middle" class="t">CloudFront</text><text x="449" y="203" text-anchor="middle" class="t">API Gateway</text><text x="604" y="203" text-anchor="middle" class="t">Lambda</text><text x="759" y="203" text-anchor="middle" class="t">SQS</text><text x="55" y="300" class="h">CONTROLLED STATE AND OPERATIONS</text><image href="../diagram/aws/s3.svg" x="145" y="338" width="72" height="72"/><text x="181" y="440" text-anchor="middle" class="t">Policy source</text><image href="../diagram/aws/dynamodb.svg" x="381" y="338" width="72" height="72"/><text x="417" y="440" text-anchor="middle" class="t">DynamoDB state</text><image href="../diagram/aws/cognito.svg" x="625" y="338" width="72" height="72"/><text x="661" y="440" text-anchor="middle" class="t">Cognito staff identity</text><image href="../diagram/aws/cloudwatch.svg" x="895" y="338" width="72" height="72"/><text x="931" y="440" text-anchor="middle" class="t">CloudWatch</text><path d="M604 215V270M417 328V250H604M661 328V250H604M931 328V250H604" class="l" marker-end="url(#a)"/></svg>
