<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Container delivery and GitOps workflow</title><desc id="desc">The application repository is tested and scanned in GitHub Actions, producing an immutable container image. A separate desired-state repository drives Argo CD and Helm into a local Kubernetes cluster.</desc><defs><style>.t{font:600 15px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.b{fill:#fff;stroke:#a6b6bc;stroke-width:1.5}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="480" fill="#f8f8f5"/><text x="55" y="52" class="h">SOURCE → QUALITY GATES → IMMUTABLE IMAGE → RECONCILIATION</text><image href="../toolkit/github.svg" x="80" y="100" width="82" height="82"/><text x="121" y="220" text-anchor="middle" class="t">Application repo</text><image href="../toolkit/github-actions.svg" x="300" y="100" width="82" height="82"/><text x="341" y="220" text-anchor="middle" class="t">Test · build · scan</text><rect x="510" y="100" width="165" height="82" rx="8" fill="#e6f0f2" stroke="#146c7e" stroke-width="2"/><text x="592" y="133" text-anchor="middle" class="t">GHCR image</text><text x="592" y="158" text-anchor="middle" class="s">immutable digest</text><image href="../toolkit/argocd.svg" x="775" y="100" width="82" height="82"/><text x="816" y="220" text-anchor="middle" class="t">Argo CD</text><image href="../toolkit/kubernetes.svg" x="1010" y="100" width="82" height="82"/><text x="1051" y="220" text-anchor="middle" class="t">Local Kubernetes</text><path d="M172 141H290M392 141H500M685 141H765M867 141H1000" class="l" marker-end="url(#a)"/><text x="55" y="320" class="h">OWNERSHIP BOUNDARY</text><rect x="55" y="350" width="1090" height="78" rx="8" class="b"/><text x="155" y="397" class="t">Application repository</text><text x="355" y="397" class="s">code · tests · image</text><line x1="580" y1="365" x2="580" y2="413" stroke="#c3ced1"/><text x="640" y="397" class="t">GitOps repository</text><text x="810" y="397" class="s">reviewed desired state · rollback</text></svg>
