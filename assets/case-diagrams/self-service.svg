<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Secure self-service cloud platform workflow</title><desc id="desc">A developer request passes through fail-closed policy, creates deterministic evidence, receives human review and reaches a protected delivery handoff. AWS and Azure Terraform roots remain unapplied design targets.</desc><defs><style>.t{font:600 15px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.b{fill:#fff;stroke:#a6b6bc;stroke-width:1.5}.hi{fill:#e6f0f2;stroke:#146c7e;stroke-width:2}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="520" fill="#f8f8f5"/><text x="55" y="52" class="h">REQUEST → POLICY → EVIDENCE → REVIEW</text><rect x="55" y="90" width="180" height="95" rx="8" class="b"/><text x="145" y="128" text-anchor="middle" class="t">Developer request</text><text x="145" y="153" text-anchor="middle" class="s">portal · API · CLI</text><rect x="300" y="90" width="180" height="95" rx="8" class="hi"/><text x="390" y="128" text-anchor="middle" class="t">Policy engine</text><text x="390" y="153" text-anchor="middle" class="s">fail closed</text><rect x="545" y="90" width="180" height="95" rx="8" class="b"/><text x="635" y="128" text-anchor="middle" class="t">Proposal evidence</text><text x="635" y="153" text-anchor="middle" class="s">IDs · hashes · resources</text><image href="../toolkit/github.svg" x="825" y="101" width="72" height="72"/><text x="861" y="210" text-anchor="middle" class="t">Human review</text><image href="../toolkit/github-actions.svg" x="1030" y="101" width="72" height="72"/><text x="1066" y="210" text-anchor="middle" class="t">Protected handoff</text><path d="M235 137H290M480 137H535M725 137H815M907 137H1020" class="l" marker-end="url(#a)"/><text x="55" y="305" class="h">DESIGN TARGETS · NOT APPLIED</text><rect x="55" y="335" width="1090" height="125" rx="8" fill="#eef2f2" stroke="#b8c5c9" stroke-dasharray="7 7"/><image href="../toolkit/terraform.svg" x="155" y="362" width="66" height="66"/><text x="245" y="402" class="t">AWS Terraform root</text><image href="../diagram/aws/vpc.svg" x="430" y="362" width="66" height="66"/><image href="../diagram/aws/eks.svg" x="520" y="362" width="66" height="66"/><image href="../diagram/azure-vnet.svg" x="740" y="362" width="66" height="66"/><text x="830" y="402" class="t">Azure Terraform root</text></svg>
