<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Secure URL shortener target architecture</title><desc id="desc">A client passes validation before an AWS load balancer and ECS service store URL lifecycle state in Aurora. Secrets and monitoring support the proposed environment.</desc><defs><style>.t{font:600 15px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.b{fill:#fff;stroke:#a6b6bc;stroke-width:1.5}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="500" fill="#f8f8f5"/><text x="55" y="52" class="h">VALIDATE → STORE → RESOLVE · AWS TARGET DESIGN</text><rect x="55" y="90" width="175" height="90" rx="8" class="b"/><text x="142" y="126" text-anchor="middle" class="t">Client request</text><text x="142" y="151" text-anchor="middle" class="s">browser · API</text><rect x="290" y="90" width="175" height="90" rx="8" fill="#e6f0f2" stroke="#146c7e" stroke-width="2"/><text x="377" y="126" text-anchor="middle" class="t">Validation</text><text x="377" y="151" text-anchor="middle" class="s">ownership · DNS · limits</text><image href="../diagram/aws/alb.svg" x="550" y="97" width="76" height="76"/><image href="../diagram/aws/ecs.svg" x="765" y="97" width="76" height="76"/><image href="../diagram/aws/aurora.svg" x="980" y="97" width="76" height="76"/><path d="M230 135H280M465 135H540M636 135H755M851 135H970" class="l" marker-end="url(#a)"/><text x="588" y="207" text-anchor="middle" class="t">Load balancer</text><text x="803" y="207" text-anchor="middle" class="t">FastAPI on ECS</text><text x="1018" y="207" text-anchor="middle" class="t">Aurora state</text><text x="55" y="302" class="h">SECURITY AND OPERATIONS</text><rect x="55" y="332" width="1090" height="110" rx="8" class="b"/><image href="../diagram/aws/secrets.svg" x="190" y="350" width="64" height="64"/><text x="275" y="389" class="t">Secrets Manager</text><rect x="510" y="350" width="180" height="64" rx="8" class="b"/><text x="600" y="378" text-anchor="middle" class="t">Lifecycle contract</text><text x="600" y="401" text-anchor="middle" class="s">active · expired · disabled</text><image href="../diagram/aws/cloudwatch.svg" x="865" y="350" width="64" height="64"/><text x="950" y="389" class="t">CloudWatch</text></svg>
