<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">CircuitCare agentic support architecture</title><desc id="desc">Customers and staff use a local website and trusted API. Cognito and DynamoDB retain identity and business authority. Bedrock AgentCore provides grounded assistance, memory and controlled tools with CloudWatch monitoring.</desc>
<defs><style>.t{font:600 16px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.box{fill:#fff;stroke:#9fb0b7;stroke-width:1.5}.trust{fill:#e6f0f2;stroke:#146c7e;stroke-width:2}.line{stroke:#647b86;stroke-width:2;fill:none}.dash{stroke:#82959d;stroke-width:2;stroke-dasharray:7 7;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#647b86"/></marker></defs>
<rect width="1200" height="620" fill="#f8f8f5"/><text x="60" y="55" class="h">CUSTOMER EXPERIENCE</text><rect x="60" y="85" width="210" height="105" rx="8" class="box"/><text x="165" y="128" text-anchor="middle" class="t">Customer + staff</text><text x="165" y="154" text-anchor="middle" class="s">React website</text><rect x="340" y="85" width="240" height="105" rx="8" class="trust"/><text x="460" y="128" text-anchor="middle" class="t">Trusted application API</text><text x="460" y="154" text-anchor="middle" class="s">identity · rules · audit</text><path d="M270 137H328" class="line" marker-end="url(#a)"/>
<text x="60" y="255" class="h">BUSINESS AUTHORITY</text><rect x="60" y="280" width="520" height="205" rx="10" fill="#eef2f2" stroke="#b8c5c9"/><image href="../diagram/aws/cognito.svg" x="115" y="320" width="70" height="70"/><text x="150" y="415" text-anchor="middle" class="t">Cognito</text><text x="150" y="441" text-anchor="middle" class="s">verified identity</text><image href="../diagram/aws/dynamodb.svg" x="310" y="320" width="70" height="70"/><text x="345" y="415" text-anchor="middle" class="t">DynamoDB records</text><text x="345" y="441" text-anchor="middle" class="s">orders · returns · cases</text><rect x="445" y="320" width="95" height="70" rx="7" class="box"/><text x="492" y="350" text-anchor="middle" class="t">Rules</text><text x="492" y="373" text-anchor="middle" class="s">final authority</text><path d="M460 190V270" class="line" marker-end="url(#a)"/>
<text x="650" y="55" class="h">BOUNDED AI ASSISTANCE</text><rect x="650" y="85" width="490" height="400" rx="10" fill="#fff" stroke="#9fb0b7"/><rect x="700" y="125" width="175" height="82" rx="8" class="trust"/><text x="787" y="158" text-anchor="middle" class="t">AgentCore Runtime</text><text x="787" y="181" text-anchor="middle" class="s">managed agent</text><image href="../diagram/aws/bedrock.svg" x="930" y="118" width="70" height="70"/><text x="1040" y="150" class="t">Bedrock</text><text x="1040" y="176" class="s">model · knowledge</text><path d="M875 166H913" class="line" marker-end="url(#a)"/>
<image href="../diagram/aws/apigw.svg" x="710" y="285" width="58" height="58"/><text x="739" y="367" text-anchor="middle" class="t">Gateway</text><image href="../diagram/aws/lambda.svg" x="835" y="285" width="58" height="58"/><text x="864" y="367" text-anchor="middle" class="t">Tools</text><rect x="955" y="285" width="105" height="58" rx="7" class="box"/><text x="1007" y="310" text-anchor="middle" class="t">Memory</text><text x="1007" y="331" text-anchor="middle" class="s">browser · code</text><path d="M787 207V265H739V275M787 265H864V275M787 265H1007V275" class="dash" marker-end="url(#a)"/><path d="M580 137H638" class="line" marker-end="url(#a)"/>
