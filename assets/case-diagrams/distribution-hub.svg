<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Distribution Centers Hub delivery architecture</title><desc id="desc">GitLab continuous integration validates and packages infrastructure and application changes. Terraform and Helm deliver to Amazon EKS, while monitoring and security controls support reliable operations.</desc><defs><style>.t{font:600 15px Arial;fill:#102334}.s{font:13px Arial;fill:#5a6d78}.h{font:700 12px Arial;letter-spacing:2px;fill:#146c7e}.b{fill:#fff;stroke:#a6b6bc;stroke-width:1.5}.l{stroke:#667d87;stroke-width:2;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667d87"/></marker></defs><rect width="1200" height="500" fill="#f8f8f5"/><text x="55" y="52" class="h">REVIEWED CHANGE → AUTOMATED DELIVERY → KUBERNETES OPERATIONS</text><rect x="55" y="95" width="185" height="90" rx="8" class="b"/><text x="147" y="132" text-anchor="middle" class="t">Application change</text><text x="147" y="157" text-anchor="middle" class="s">reviewed source</text><rect x="310" y="95" width="185" height="90" rx="8" fill="#e6f0f2" stroke="#146c7e" stroke-width="2"/><text x="402" y="132" text-anchor="middle" class="t">GitLab CI</text><text x="402" y="157" text-anchor="middle" class="s">test · validate · package</text><image href="../toolkit/terraform.svg" x="585" y="102" width="76" height="76"/><image href="../toolkit/helm.svg" x="775" y="102" width="76" height="76"/><image href="../diagram/aws/eks.svg" x="990" y="102" width="76" height="76"/><path d="M240 140H300M495 140H575M671 140H765M861 140H980" class="l" marker-end="url(#a)"/><text x="623" y="212" text-anchor="middle" class="t">Terraform</text><text x="813" y="212" text-anchor="middle" class="t">Helm</text><text x="1028" y="212" text-anchor="middle" class="t">Amazon EKS</text><text x="55" y="310" class="h">OPERATING CONTROLS</text><rect x="55" y="340" width="1090" height="105" rx="8" class="b"/><text x="135" y="400" class="t">Identity and secrets</text><line x1="360" y1="360" x2="360" y2="425" stroke="#c3ced1"/><text x="430" y="400" class="t">Health checks and rollout safety</text><line x1="760" y1="360" x2="760" y2="425" stroke="#c3ced1"/><text x="830" y="400" class="t">Monitoring and recovery</text></svg>
